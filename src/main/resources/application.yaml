spring:
  application:
    name: footballay-data-quality-service
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

footballay:
  data-quality:
    fixture-single:
      lineup-availability:
        not-started-grace-minutes: ${FOOTBALLAY_DATA_QUALITY_FIXTURE_SINGLE_LINEUP_AVAILABILITY_NOT_STARTED_GRACE_MINUTES:3}
    pipeline:
      enabled: false
      consumer-group: footballay-data-quality-service
      raw-collected-topic: football-data-raw-collected
      quality-result-topic: football-data-quality-result
      reader:
        type: noop
        mock-data-resource: classpath:mock/20260712T033403Z_Iq_XxagJ8LaiRo1Fy1M4oYRNxUhVIp8aOn9jJCmAGWY.json.gz
        bucket: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_BUCKET:}
        region: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_REGION:ap-northeast-2}
        endpoint: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_ENDPOINT:}
        path-style-access-enabled: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_PATH_STYLE_ACCESS_ENABLED:false}
        access-key: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_ACCESS_KEY:}
        secret-key: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_SECRET_KEY:}
      store:
        type: mongo

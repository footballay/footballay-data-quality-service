spring:
  kafka:
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-location: file:${AIVEN_KAFKA_CA_PATH}
      trust-store-type: PEM
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${AIVEN_KAFKA_CORE_USERNAME}"
        password="${AIVEN_KAFKA_CORE_PASSWORD}";
    bootstrap-servers: ${AIVEN_KAFKA_BOOTSTRAP_SERVERS}

spring:
  data:
    mongodb:
      uri: ${FOOTBALLAY_MONGODB_URI}
  kafka:
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-location: file:${AIVEN_KAFKA_CA_PATH:/run/secrets/aiven-kafka-ca.pem}
      trust-store-type: PEM
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${AIVEN_KAFKA_DQ_USERNAME}"
        password="${AIVEN_KAFKA_DQ_PASSWORD}";
    bootstrap-servers: ${AIVEN_KAFKA_BOOTSTRAP_SERVERS}

management:
  server:
    port: 9001
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

loki:
  url: ${LOKI_URL}
  username: ${LOKI_USERNAME}
  password: ${LOKI_PASSWORD}

footballay:
  data-quality:
    pipeline:
      enabled: ${FOOTBALLAY_DATA_QUALITY_PIPELINE_ENABLED:false}
      reader:
        type: s3
        bucket: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_BUCKET:footballay-data-quality}
        region: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_REGION:ap-northeast-2}
        endpoint: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_ENDPOINT:}
        path-style-access-enabled: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_PATH_STYLE_ACCESS_ENABLED:false}
      store:
        type: mongo

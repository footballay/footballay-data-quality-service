spring:
  kafka:
    bootstrap-servers: localhost:9092
  data:
    mongodb:
      uri: mongodb://localhost:27017/footballay_data_quality

footballay:
  data-quality:
    pipeline:
      enabled: true
      consumer-group: footballay-data-quality-service-local
      reader:
        type: s3
        bucket: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_BUCKET:footballay-data-quality-raw-local}
        region: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_REGION:ap-northeast-2}
        endpoint: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_ENDPOINT:http://localhost:8333}
        path-style-access-enabled: true
        access-key: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_ACCESS_KEY:seaweedfsadmin}
        secret-key: ${FOOTBALLAY_DATA_QUALITY_RAW_S3_SECRET_KEY:seaweedfsadmin}
      store:
        type: mongo
